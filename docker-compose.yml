# Local development stack. The explicit project name keeps this stack's
# resources (volume, network, containers) separate from the production stack
# in docker-compose.prod.yml, which takes its project name from the checkout
# directory (project-pilot). Never remove it: without it, running this file in
# that directory would mount the production pgdata volume.
name: project-pilot-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: project_pilot
      POSTGRES_PASSWORD: project_pilot
      POSTGRES_DB: project_pilot
    ports:
      # Loopback only: the dev database uses a fixed development password.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_pilot"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://project_pilot:project_pilot@db:5432/project_pilot
      SESSION_SECRET: dev-credential-key-change-me
      PORT: "3001"
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time only: Next.js inlines NEXT_PUBLIC_* into the client bundle.
        NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
