services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: project_pilot
      POSTGRES_PASSWORD: project_pilot
      POSTGRES_DB: project_pilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_pilot"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://project_pilot:project_pilot@db:5432/project_pilot
      SESSION_SECRET: dev-session-secret-change-me
      PORT: "3001"
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"

volumes:
  pgdata:
