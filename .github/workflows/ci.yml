name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow release.yml to invoke this workflow as a reusable workflow so the
  # release tag-push runs the same lint/build checks as any other merge.
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: cd backend && npx prisma generate
      - run: npm run lint --workspace=backend
      - run: npm run lint:test --workspace=backend
      - run: npm run build --workspace=backend

  backend-test:
    # Runs the backend vitest suite with v8 coverage. The coverage gate
    # enforces per-file thresholds for the four HIGH-gap security files
    # (middleware/csrf.ts, routes/credentials.ts, services/credentials.ts,
    # routes/tasks.ts) — see backend/vitest.config.ts for exact values.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # The suite imports the generated Prisma client; generate it first
      # (mirrors the backend job) so the run does not fail on a missing
      # @prisma/client.
      - run: cd backend && npx prisma generate
      - run: npm run test:coverage --workspace=backend

  mcp:
    # Typechecks/builds the mcp workspace. Guards against a duplicate zod
    # install (e.g. a nested zod resolved under
    # node_modules/@modelcontextprotocol/sdk/node_modules) forcing tsc to
    # structurally compare our zod schemas against a second, physically
    # distinct zod's types — that blows past the default V8 heap (tsc exits
    # 134). See mcp/src/tools.ts and root package.json for context.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Assert single zod resolution
        # Fails in ~1s with a clear message on a duplicate-zod relapse,
        # instead of the mcp build step dying after a ~60s heap crash.
        run: |
          count=$(node -e "console.log(Object.keys(require('./package-lock.json').packages).filter(k => k.split('node_modules/').pop() === 'zod').length)")
          if [ "$count" -ne 1 ]; then
            echo "expected exactly 1 zod resolution in package-lock.json, found $count"
            node -e "Object.keys(require('./package-lock.json').packages).filter(k => k.split('node_modules/').pop() === 'zod').forEach(k => console.log('  ' + k))"
            exit 1
          fi
      - run: npm run typecheck:test --workspace=mcp
      - run: npm run build --workspace=mcp

  mcp-test:
    # Runs the mcp vitest suite with v8 coverage. The coverage gate enforces
    # per-file thresholds for src/client.ts and src/tools.ts — see
    # mcp/vitest.config.ts for exact values.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:coverage --workspace=mcp

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck:test --workspace=frontend
      - name: Forbid next/font/google
        # Fonts are vendored in frontend/src/fonts and loaded via
        # next/font/local; next/font/google makes `next build` depend on
        # fonts.googleapis.com being reachable and well-formed.
        # grep exits 1 for "no match" and 2 on errors (missing path,
        # unreadable file); only 1 may pass.
        run: |
          rc=0
          grep -rn --include='*.ts' --include='*.tsx' --include='*.mts' --include='*.cts' --include='*.js' --include='*.jsx' --include='*.mjs' --include='*.cjs' --exclude-dir=node_modules --exclude-dir=.next 'next/font/google' frontend || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "next/font/google is forbidden, vendor the font and use next/font/local" >&2
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "font guard: grep failed (exit $rc)" >&2
            exit 1
          fi
      - run: npm run build --workspace=frontend

  frontend-test:
    # Runs the frontend vitest suite with v8 coverage. The coverage gate
    # enforces per-file thresholds for src/lib/api.ts and
    # src/components/deploys/InstallRelayWizard.tsx — see
    # frontend/vitest.config.ts for exact values.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:coverage --workspace=frontend

  compose-isolation:
    # Guards against the dev compose file resolving to the same pgdata volume
    # as the production file, however the compose project name is overridden.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dev and prod pgdata volumes differ
        env:
          POSTGRES_PASSWORD: dummy
          SESSION_SECRET: dummy
          PROJECT_FORGE_URL: http://forge.invalid
          AGENT_TASKS_URL: http://tasks.invalid
          DEPLOY_PANEL_URL: http://deploy.invalid
        run: |
          # Per variant, render the prod file and the dev side (as
          # `-f docker-compose.yml` and as a plain `docker compose`), each with
          # every compose profile enabled so no profile-gated service is left
          # out. A failed dev render leaves its JSON empty and fails the volume
          # name check; a jq error fails the step.
          render() {
            docker compose "$@" --profile '*' config --format json
          }
          # Name of the volume the db service mounts (not a fixed key).
          db_volume() {
            jq -r '
              [.services.db.volumes[]? | select(.type == "volume") | .source] as $src
              | if ($src | length) == 1 then (.volumes[$src[0]].name // "") else "" end'
          }
          # Checks on one dev render: the db volume differs from prod, no dev
          # volume carries the production name, and no service borrows another
          # container's volumes (volumes_from container:...).
          check_dev() {
            local label="$1" dev_json="$2" dev rc
            dev=$(printf '%s' "$dev_json" | db_volume)
            echo "$label: dev=$dev prod=$prod"
            if [ -z "$dev" ] || [ "$dev" = null ] || [ "$dev" = "$prod" ]; then
              echo "dev and prod pgdata volume names must be set and differ ($label)" >&2
              exit 1
            fi
            # jq exits 0 on a match, 1 on none; anything else is an error.
            rc=0
            printf '%s' "$dev_json" | jq -e --arg p "$prod" '[.volumes[]?.name] | index($p)' >/dev/null || rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "a dev volume is named like the production volume $prod, or the check failed (jq exit $rc, $label)" >&2
              exit 1
            fi
            rc=0
            printf '%s' "$dev_json" | jq -e '[.services[]?.volumes_from[]?] | length > 0' >/dev/null || rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "a dev service uses volumes_from, or the check failed (jq exit $rc, $label)" >&2
              exit 1
            fi
          }
          check() {
            label="$1"; shift
            prod_json=$(render -f docker-compose.prod.yml)
            prod=$(printf '%s' "$prod_json" | db_volume)
            if [ -z "$prod" ] || [ "$prod" = null ]; then
              echo "prod pgdata volume name must be set ($label)" >&2
              exit 1
            fi
            # The dev file as named, and whatever a plain `docker compose`
            # resolves in the repo root (what the make targets run; it also
            # picks up compose.yaml or an override file if one is committed).
            check_dev "$label (-f docker-compose.yml)" "$(render -f docker-compose.yml "$@")"
            check_dev "$label (plain)" "$(render "$@")"
          }
          check plain
          (export COMPOSE_PROJECT_NAME=project-pilot; check "COMPOSE_PROJECT_NAME=project-pilot")
          check "-p project-pilot" -p project-pilot

  backup-scripts:
    # shellcheck and the stub-docker tests of the database backup and restore
    # scripts (scripts/backup.sh, scripts/restore.sh). No container is needed.
    name: Backup scripts (shellcheck, stub tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: backup.sh against a stubbed docker
        run: bash scripts/backup.test.sh
      - name: restore.sh against a stubbed docker
        run: bash scripts/restore.test.sh

  restore-drill:
    # Round-trips a seeded database through the real backup and restore scripts
    # against a throwaway Postgres 16 (see scripts/restore-drill.sh). A backup
    # that has never been restored is a hope.
    name: Restore drill (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: project_pilot
          POSTGRES_PASSWORD: project_pilot
          POSTGRES_DB: project_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_pilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Back up, restore into a fresh database, compare
        env:
          # The id of the job's own postgres service container, not a docker ps guess.
          DRILL_PG_CONTAINER: ${{ job.services.postgres.id }}
          DRILL_DATABASE_URL: postgresql://project_pilot:project_pilot@localhost:5432/project_pilot
        run: bash scripts/restore-drill.sh
