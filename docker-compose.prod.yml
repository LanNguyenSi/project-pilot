x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: project-pilot-db
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      POSTGRES_USER: project_pilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: project_pilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_pilot"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: project-pilot-backend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://project_pilot:${POSTGRES_PASSWORD}@db:5432/project_pilot
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: "3001"
      CORS_ORIGINS: https://project-pilot.opentriologue.ai
      FRONTEND_URL: https://project-pilot.opentriologue.ai
      BACKEND_URL: https://project-pilot.opentriologue.ai
      NODE_ENV: production
      PROJECT_FORGE_URL: ${PROJECT_FORGE_URL:?PROJECT_FORGE_URL must be set for production}
      AGENT_TASKS_URL: ${AGENT_TASKS_URL:?AGENT_TASKS_URL must be set for production}
      DEPLOY_PANEL_URL: ${DEPLOY_PANEL_URL:?DEPLOY_PANEL_URL must be set for production}
      # GitHub OAuth — optional; the /api/oauth/github/* routes return 503
      # when either value is empty, so leaving them unset is a safe no-op.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.project-pilot-api.rule=Host(`project-pilot.opentriologue.ai`) && PathPrefix(`/api`)"
      - "traefik.http.routers.project-pilot-api.priority=20"
      - "traefik.http.routers.project-pilot-api.entrypoints=websecure"
      - "traefik.http.routers.project-pilot-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.project-pilot-api.loadbalancer.server.port=3001"
    networks:
      - internal
      - traefik

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://project-pilot.opentriologue.ai
        # URL the /security page embeds as an iframe. Baked at build time
        # because Next.js inlines NEXT_PUBLIC_* into the client bundle.
        NEXT_PUBLIC_DEPSIGHT_URL: https://depsight.opentriologue.ai
    container_name: project-pilot-frontend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    depends_on:
      - backend
    environment:
      HOSTNAME: "0.0.0.0"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.project-pilot.rule=Host(`project-pilot.opentriologue.ai`)"
      - "traefik.http.routers.project-pilot.priority=10"
      - "traefik.http.routers.project-pilot.entrypoints=websecure"
      - "traefik.http.routers.project-pilot.tls.certresolver=letsencrypt"
      - "traefik.http.services.project-pilot.loadbalancer.server.port=3000"
    networks:
      - internal
      - traefik

volumes:
  pgdata:

networks:
  internal:
  traefik:
    external: true
