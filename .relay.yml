name: project-pilot
health: /api/health
health_port: 3001
compose_file: docker-compose.prod.yml
post_update:
  # `prisma db push` runs without a data-loss override flag. A change that would lose
  # data (dropping a non-empty column or table, adding a UNIQUE constraint over
  # duplicate values) makes the push exit non-zero, so this step and the deploy
  # fail and nothing is dropped. Apply such a change deliberately by hand, with
  # a database backup first (see docs/configuration.md).
  - docker compose -f docker-compose.prod.yml exec -e HOME=/tmp backend npx prisma db push --schema=prisma/schema.prisma
rollback: true
